<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MONKEY BAR Sports Ticker</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Oswald:wght@500;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        :root {
            --primary-glow: #00f0ff;
            --secondary-glow: #ff0055;
            --accent-gold: #ffcc00;
            --bg-dark: #030508;
            --card-bg: rgba(10, 16, 26, 0.88);
            --team-primary: #00f0ff;
            --team-secondary: #ff0055;
            --stadium-glow: rgba(0, 240, 255, 0.18);
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Roboto Condensed', sans-serif;
            cursor: none;
        }

        /* CANVAS CYBER BACKGROUND */
        #cyberCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.45;
        }

        /* PERFECTLY CENTERED 90-DEGREE ROTATION FOR PORTRAIT MOUNTED 16:9 TV */
        body.rotated-90 {
            width: 100vh !important;
            height: 100vw !important;
            transform: rotate(90deg);
            transform-origin: center center;
            position: absolute;
            top: calc(50% - 50vw);
            left: calc(50% - 50vh);
        }

        .tv-frame {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: radial-gradient(circle at 50% 25%, var(--stadium-glow) 0%, rgba(3, 5, 8, 0.98) 75%);
            position: relative;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.95);
            transition: background 1.2s ease-in-out;
            z-index: 2;
        }

        .stadium-flare {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 130%;
            height: 40vh;
            background: radial-gradient(ellipse at top, var(--team-primary) 0%, rgba(0,0,0,0) 70%);
            opacity: 0.3;
            pointer-events: none;
            transition: all 1.2s ease-in-out;
            z-index: 2;
        }

        header {
            z-index: 10;
            padding: 2vh 2vw 1vh;
            background: linear-gradient(180deg, rgba(3,5,8,0.98) 0%, rgba(3,5,8,0.6) 80%, transparent 100%);
            border-bottom: 2px solid rgba(0, 240, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header-top-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5vh;
        }

        .sync-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: clamp(0.75rem, 1.2vh, 1.1rem);
            color: #00f0ff;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 1px;
            background: rgba(0, 240, 255, 0.08);
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid rgba(0, 240, 255, 0.25);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
        }

        .sync-spinner {
            width: 10px;
            height: 10px;
            border: 2px solid var(--accent-gold);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .header-right-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .rotate-btn-icon {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            width: clamp(28px, 4vh, 38px);
            height: clamp(28px, 4vh, 38px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .rotate-btn-icon:hover {
            background: rgba(0, 240, 255, 0.2);
            border-color: var(--primary-glow);
            transform: scale(1.08);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .rotate-btn-icon svg {
            width: 60%;
            height: 60%;
            fill: #ffffff;
        }

        .bar-title {
            font-family: 'Teko', sans-serif;
            font-size: clamp(2.8rem, 5.5vh, 4.8rem);
            line-height: 0.85;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(180deg, #ffffff 20%, #00f0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
            text-align: center;
        }

        .live-clock {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(1rem, 2vh, 1.6rem);
            color: var(--accent-gold);
            letter-spacing: 1.5px;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.6);
        }

        .sport-badge-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 0.8vh;
        }

        .league-badge {
            background: var(--team-primary);
            color: #030508;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: clamp(0.9rem, 1.8vh, 1.4rem);
            padding: 4px 20px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 20px var(--team-primary);
            transition: all 0.8s ease;
        }

        .rotator-timer-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            position: absolute;
            bottom: 0;
            left: 0;
            overflow: hidden;
        }

        .rotator-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--team-primary), var(--team-secondary));
            box-shadow: 0 0 12px var(--team-primary);
            transition: width 0.1s linear;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 1.5vh 2vw;
            gap: 1.5vh;
            z-index: 5;
        }

        .matchup-card, .spotlight-card {
            background: var(--card-bg);
            border: 2px solid rgba(0, 240, 255, 0.3);
            border-radius: 20px;
            padding: 2vh 2vw;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9), 0 0 40px var(--stadium-glow);
            backdrop-filter: blur(14px);
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out, border-color 0.8s ease, box-shadow 0.8s ease;
            opacity: 1;
            transform: scale(1);
        }

        .matchup-card::before, .spotlight-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--team-primary), transparent);
        }

        .matchup-card.fade-out, .spotlight-card.fade-out {
            opacity: 0;
            transform: scale(0.97);
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2vh;
            padding-bottom: 0.8vh;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .game-status {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.85rem, 1.6vh, 1.3rem);
            padding: 4px 14px;
            border-radius: 6px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .status-live {
            background: #ff0044;
            color: #fff;
            animation: pulse-red 1.5s infinite;
            box-shadow: 0 0 15px rgba(255, 0, 68, 0.6);
        }

        .status-pregame {
            background: rgba(0, 240, 255, 0.2);
            color: #00f0ff;
            border: 1px solid #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 68, 0.8); }
            70% { box-shadow: 0 0 0 12px rgba(255, 0, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 68, 0); }
        }

        .network-info {
            font-size: clamp(0.85rem, 1.5vh, 1.2rem);
            color: #00f0ff;
            font-weight: 700;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        /* LIVE WIN PROBABILITY / MOMENTUM BAR */
        .momentum-bar-container {
            margin-bottom: 1.2vh;
        }

        .momentum-labels {
            display: flex;
            justify-content: space-between;
            font-size: clamp(0.65rem, 1.1vh, 0.85rem);
            color: #a0aab5;
            font-family: 'Oswald', sans-serif;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .momentum-track {
            height: 8px;
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
        }

        .momentum-away {
            height: 100%;
            background: var(--team-primary);
            box-shadow: 0 0 10px var(--team-primary);
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .momentum-home {
            height: 100%;
            background: var(--team-secondary);
            box-shadow: 0 0 10px var(--team-secondary);
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .teams-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 1vw;
            margin-bottom: 1.5vh;
        }

        .team-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo-wrapper {
            width: clamp(75px, 12vh, 130px);
            height: clamp(75px, 12vh, 130px);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5vh;
            filter: drop-shadow(0 0 18px rgba(0, 240, 255, 0.4));
        }

        .team-logo, .fighter-photo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .team-name {
            font-family: 'Teko', sans-serif;
            font-size: clamp(1.9rem, 3.4vh, 3.2rem);
            font-weight: 700;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        .team-record {
            font-size: clamp(0.75rem, 1.3vh, 1rem);
            color: #8a9ba8;
            margin-top: 2px;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 1px;
        }

        .score-display {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(2.8rem, 5.5vh, 4.5rem);
            font-weight: 700;
            color: #ffffff;
            line-height: 1;
            margin-top: 4px;
            text-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
        }

        .vs-divider {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .vs-text {
            font-family: 'Teko', sans-serif;
            font-size: clamp(1.8rem, 3vh, 2.8rem);
            color: var(--accent-gold);
            font-weight: 700;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
        }

        .game-time {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.85rem, 1.6vh, 1.2rem);
            color: #ffffff;
            text-align: center;
            letter-spacing: 1px;
        }

        .odds-bar {
            background: rgba(3, 5, 8, 0.8);
            border: 1px solid rgba(255, 204, 0, 0.4);
            border-radius: 12px;
            padding: 1.2vh 1vw;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.15);
        }

        .odds-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
        }

        .odds-label {
            font-size: clamp(0.65rem, 1.1vh, 0.9rem);
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            text-align: center;
            width: 100%;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
        }

        .odds-value {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(1rem, 1.9vh, 1.6rem);
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            width: 100%;
            letter-spacing: 1px;
        }

        .spotlight-card {
            padding: 1.5vh 2vw;
            gap: 1vh;
            border-width: 1px;
        }

        .spotlight-title {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.85rem, 1.6vh, 1.2rem);
            color: var(--team-primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.6vh;
            text-shadow: 0 0 10px var(--team-primary);
        }

        .players-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1vw;
        }

        .player-card {
            display: flex;
            align-items: center;
            gap: 0.8vw;
            background: rgba(3, 5, 8, 0.6);
            padding: 1.2vh 1vw;
            border-radius: 12px;
            border-left: 4px solid var(--team-primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .player-card.away {
            border-left-color: var(--team-primary);
        }

        .player-card.home {
            border-left-color: var(--team-secondary);
        }

        .player-headshot {
            width: clamp(45px, 6.5vh, 65px);
            height: clamp(45px, 6.5vh, 65px);
            border-radius: 50%;
            object-fit: cover;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.3);
            flex-shrink: 0;
            box-shadow: 0 0 12px rgba(255,255,255,0.2);
        }

        .player-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .player-name {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.95rem, 1.9vh, 1.4rem);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.1;
            letter-spacing: 1px;
        }

        .player-pos {
            font-size: clamp(0.65rem, 1.2vh, 0.9rem);
            color: #8a9ba8;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        .player-stat-line {
            font-size: clamp(0.8rem, 1.5vh, 1.2rem);
            color: var(--accent-gold);
            font-weight: 700;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
        }

        .ufc-tape-grid {
            display: flex;
            flex-direction: column;
            gap: 0.8vh;
        }

        .tape-row {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            text-align: center;
            font-size: clamp(0.8rem, 1.5vh, 1.1rem);
            background: rgba(3, 5, 8, 0.6);
            padding: 0.8vh 1vw;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .tape-val {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }

        .tape-label {
            color: #8a9ba8;
            font-size: clamp(0.65rem, 1.2vh, 0.9rem);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        footer {
            height: clamp(52px, 7.5vh, 75px);
            background: #010306;
            border-top: 3px solid var(--team-primary);
            display: flex;
            align-items: center;
            overflow: hidden;
            position: relative;
            z-index: 10;
            box-shadow: 0 -8px 30px rgba(0,0,0,0.95), 0 0 20px var(--team-primary);
            transition: border-color 0.8s ease, box-shadow 0.8s ease;
        }

        .ticker-label-badge {
            background: var(--team-primary);
            color: #030508;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: clamp(0.95rem, 1.9vh, 1.5rem);
            padding: 0 20px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            white-space: nowrap;
            letter-spacing: 2px;
            box-shadow: 8px 0 20px rgba(0,0,0,0.8);
            transition: background 0.8s ease;
        }

        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
        }

        .ticker-move {
            display: inline-block;
            white-space: nowrap;
            animation: scrollTicker 38s linear infinite;
        }

        @keyframes scrollTicker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        .ticker-item {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 0 35px;
            font-size: clamp(0.95rem, 1.9vh, 1.4rem);
            font-weight: 500;
            color: #e0e0e0;
            letter-spacing: 0.5px;
        }

        .ticker-item span.highlight {
            color: var(--accent-gold);
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
        }

        .ticker-item span.divider {
            color: var(--team-primary);
            margin-left: 15px;
            text-shadow: 0 0 10px var(--team-primary);
        }
    </style>
</head>
<body id="bodyEl" class="rotated-90">

    <canvas id="cyberCanvas"></canvas>

    <div class="tv-frame" id="tvFrame">
        <div class="stadium-flare" id="stadiumFlare"></div>

        <header>
            <div class="header-top-row">
                <div class="sync-badge">
                    <div class="sync-spinner"></div>
                    <span id="syncText">SYNC ACTIVE</span>

                        </svg>
                    </button>
                </div>
            </div>

            <div class="bar-title" id="barTitle">MONKEY BAR</div>

            <div class="sport-badge-container">
                <div class="league-badge" id="leagueBadge">NFL FOOTBALL</div>
            </div>

            <div class="rotator-timer-bar">
                <div class="rotator-progress" id="rotatorProgress"></div>
            </div>
        </header>

        <main>
            <div class="matchup-card" id="matchupCard">

                <!-- Live Win Probability / Momentum Bar -->
                <div class="momentum-bar-container" id="momentumContainer">

                    <div class="momentum-track">

                    </div>
                </div>

                <div class="teams-container" id="teamsContainer">
                    <div class="team-box">
                        <div class="logo-wrapper" id="logoWrapAway">
                            <img src="https://a.espncdn.com/i/teamlogos/nfl/500/gb.png" class="team-logo" id="awayLogo" alt="Away">
                        </div>
                        <div class="team-name" id="awayName">PACKERS</div>
                        <div class="team-record" id="awayRecord">5-2</div>
                        <div class="score-display" id="awayScore">-</div>
                    </div>

                    <div class="vs-divider">

                        <div class="game-time" id="gameTimeCenter">SUN 10/25</div>

                    <div class="team-box">
                        <div class="logo-wrapper" id="logoWrapHome">
                            <img src="https://a.espncdn.com/i/teamlogos/nfl/500/det.png" class="team-logo" id="homeLogo" alt="Home">
